name: Weekly AI News Audio

on:
  schedule:
    # Every Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate news audio
        env:
          # LLM summarization/translation: round-robin across these Gemini/Gemma keys
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: gemma-4-26b-a4b-it
          # TTS (Fish Audio free) is served by OpenRouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/gen_news.py

      - name: Commit generated audio
        run: |
          git config user.name "voice-widget-bot"
          git config user.email "bot@shakya.work"
          git add assets/audio/news/ assets/audio/manifest.json
          git diff --cached --quiet || git commit -m "chore: weekly AI news audio $(date +%F)"
          git push
