<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Access — Shakya.work</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .vip-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 40px;
            margin-top: 24px;
        }
        .vip-box input {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: white;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .vip-box input:focus {
            border-color: #f7931e;
        }
        .vip-box button {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            background: #f7931e;
            color: #1a1a2e;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .vip-box button:hover {
            opacity: 0.9;
        }
        .vip-box button:active {
            transform: scale(0.98);
        }
        #vipError {
            color: #ff6b6b;
            margin-top: 16px;
            display: none;
            font-size: 0.95rem;
        }
        .hint {
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 480px; text-align: center;">
        <header>
            <h1 class="logo">🔐 VIP<span> Access</span></h1>
            <p class="tagline">Enter the code to access exclusive content</p>
        </header>
        <main>
            <div class="vip-box">
                <form id="vipForm" method="POST" action="/vip/">
                    <input type="password" name="password" id="vipCode" placeholder="Enter VIP code" autofocus>
                    <button type="submit">Enter VIP Area</button>
                </form>
                <p id="vipError">Invalid code. Try again.</p>
                <p class="hint">Hint: The default code is 4 digits</p>
            </div>
        </main>
        <footer>
            <p>&copy; 2026 Shakya.work</p>
        </footer>
    </div>
</body>
</html>
